<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Georgia, 'Iowan Old Style', 'Songti TC', 'Noto Serif TC', serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#9a9386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="560" rx="20" fill="#ebe7dc"/>

  <text x="48" y="48" fill="#3f3a32" font-size="22" font-weight="500">強化學習互動教學 · 新手版課程地圖</text>
  <text x="48" y="74" fill="#6e685c" font-size="13" font-family="-apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif">對話式教學 · 內建 ML 補課 · 從零到 DQN / PPO，不必先精通機器學習</text>

  <!-- Phase 1 -->
  <rect x="48" y="108" width="200" height="170" rx="14" fill="#fbfaf6" stroke="#7a9e7e" stroke-width="1.5"/>
  <rect x="64" y="124" width="72" height="22" rx="11" fill="#7a9e7e"/>
  <text x="100" y="139" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">W1–4</text>
  <text x="64" y="172" fill="#3f3a32" font-size="14" font-weight="500">新手必修基礎</text>
  <text x="64" y="198" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W1 RL 是什麼？</text>
  <text x="64" y="218" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W2 手算 Value / γ</text>
  <text x="64" y="238" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W3 Q 表 + Python</text>
  <text x="64" y="258" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">插：ML 補課 1–3</text>
  <text x="64" y="268" fill="#5f8564" font-size="10" font-family="-apple-system, sans-serif">GridWorld · 懸崖 · 梯度下降</text>

  <!-- Phase 2 -->
  <rect x="268" y="108" width="180" height="170" rx="14" fill="#fbfaf6" stroke="#8aadb8" stroke-width="1.5"/>
  <rect x="284" y="124" width="72" height="22" rx="11" fill="#8aadb8"/>
  <text x="320" y="139" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">W5–7</text>
  <text x="284" y="172" fill="#3f3a32" font-size="14" font-weight="500">深度方法入門</text>
  <text x="284" y="198" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W5 用網路學 Q（DQN）</text>
  <text x="284" y="218" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W6 不靠梯度也能搜</text>
  <text x="284" y="238" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W7 直接學動作（PPO）</text>
  <text x="284" y="258" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">演化的、策略的都要懂一點</text>
  <text x="284" y="268" fill="#5a7f8a" font-size="10" font-family="-apple-system, sans-serif">目標網路 · clip 示意</text>

  <!-- Phase 3 -->
  <rect x="468" y="108" width="140" height="170" rx="14" fill="#fbfaf6" stroke="#d4a574" stroke-width="1.5"/>
  <rect x="484" y="124" width="72" height="22" rx="11" fill="#d4a574"/>
  <text x="520" y="139" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">W8–9</text>
  <text x="484" y="172" fill="#3f3a32" font-size="14" font-weight="500">學期專題</text>
  <text x="484" y="200" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">提案規劃</text>
  <text x="484" y="220" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">基線與評估</text>
  <text x="484" y="258" fill="#a67a3d" font-size="10" font-family="-apple-system, sans-serif">自學可跳過</text>

  <!-- Phase 4 -->
  <rect x="628" y="108" width="284" height="170" rx="14" fill="#fbfaf6" stroke="#b5a8c9" stroke-width="1.5"/>
  <rect x="644" y="124" width="72" height="22" rx="11" fill="#b5a8c9"/>
  <text x="680" y="139" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">W10–14</text>
  <text x="644" y="172" fill="#3f3a32" font-size="14" font-weight="500">進階開眼界</text>
  <text x="644" y="198" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W10 演員 + 評論家</text>
  <text x="644" y="218" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W11 從示範 / 偏好反推獎勵</text>
  <text x="644" y="238" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W12 多個 AI 一起玩</text>
  <text x="644" y="258" fill="#6e685c" font-size="11" font-family="-apple-system, 'PingFang TC', sans-serif">W13 先學世界規則 · W14 實驗設計</text>
  <text x="644" y="268" fill="#6d6280" font-size="10" font-family="-apple-system, sans-serif">雙 Q 取 min · 模型式 RL</text>

  <line x1="248" y1="193" x2="264" y2="193" stroke="#9a9386" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="448" y1="193" x2="464" y2="193" stroke="#9a9386" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="608" y1="193" x2="624" y2="193" stroke="#9a9386" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="48" y="312" width="864" height="200" rx="14" fill="#fbfaf6" stroke="rgba(63,58,50,0.12)" stroke-width="1"/>
  <text x="72" y="348" fill="#3f3a32" font-size="16" font-weight="500">新手建議怎麼走</text>

  <circle cx="84" cy="388" r="11" fill="#7a9e7e"/>
  <text x="84" y="392" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">1</text>
  <text x="108" y="392" fill="#3f3a32" font-size="13" font-family="-apple-system, 'PingFang TC', sans-serif">先讀 W1–3，把演示玩到策略穩定（最重要）</text>

  <circle cx="84" cy="424" r="11" fill="#8aadb8"/>
  <text x="84" y="428" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">2</text>
  <text x="108" y="428" fill="#3f3a32" font-size="13" font-family="-apple-system, 'PingFang TC', sans-serif">再走 W4–7，理解「表格爆掉後」深度方法在修什麼</text>

  <circle cx="84" cy="460" r="11" fill="#b5a8c9"/>
  <text x="84" y="464" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">3</text>
  <text x="108" y="464" fill="#3f3a32" font-size="13" font-family="-apple-system, 'PingFang TC', sans-serif">W10–13 當開眼界；W14 是「怎麼把實驗做好」檢查表</text>

  <circle cx="84" cy="492" r="11" fill="#d4a574"/>
  <text x="84" y="496" text-anchor="middle" fill="#fbfaf6" font-size="11" font-weight="600" font-family="-apple-system, sans-serif">4</text>
  <text x="108" y="496" fill="#6e685c" font-size="12" font-family="-apple-system, 'PingFang TC', sans-serif">讀不懂公式沒關係：先看一句話總結 + 生活比喻 + 玩演示</text>
</svg>
