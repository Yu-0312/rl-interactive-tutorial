  <text x="814" y="192" fill="#F8FAFC" font-size="14" font-weight="600">專題報告</text>
  <text x="814" y="220" fill="#94A3B8" font-size="11">W14 實驗設計</text>
  <text x="814" y="240" fill="#94A3B8" font-size="11">W15–18 報告</text>
  <text x="814" y="260" fill="#F472B6" font-size="10" font-weight="500">寫作與發表</text>

