  <line x1="248" y1="193" x2="266" y2="193" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="448" y1="193" x2="466" y2="193" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="608" y1="193" x2="626" y2="193" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
