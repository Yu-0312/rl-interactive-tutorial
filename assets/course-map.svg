  <text x="48" y="74" fill="#94A3B8" font-size="13">完整 18 週課綱 · 從 DP / TD 到 DQN、PPO、Actor-Critic、多智能體與基於模型的 RL</text>

  <!-- Phase 1: Foundations -->
  <rect x="48" y="108" width="200" height="170" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
