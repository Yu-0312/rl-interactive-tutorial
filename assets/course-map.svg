  <text x="48" y="320" fill="#F8FAFC" font-size="15" font-weight="600">Canvas 互動演示</text>

  <rect x="48" y="338" width="160" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="64" y="364" fill="#38BDF8" font-size="11" font-weight="600">GridWorld DP</text>
  <text x="64" y="386" fill="#94A3B8" font-size="10">策略 / 價值迭代</text>

  <rect x="224" y="338" width="160" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="240" y="364" fill="#4ADE80" font-size="11" font-weight="600">懸崖世界</text>
  <text x="240" y="386" fill="#94A3B8" font-size="10">SARSA vs Q-learning</text>

  <rect x="400" y="338" width="160" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="416" y="364" fill="#FBBF24" font-size="11" font-weight="600">目標網路</text>
  <text x="416" y="386" fill="#94A3B8" font-size="10">DQN 穩定化示意</text>

  <rect x="576" y="338" width="160" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="592" y="364" fill="#A78BFA" font-size="11" font-weight="600">PPO clip</text>
  <text x="592" y="386" fill="#94A3B8" font-size="10">策略梯度目標函數</text>

  <rect x="752" y="338" width="164" height="72" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="768" y="364" fill="#F472B6" font-size="11" font-weight="600">雙 Q 取最小</text>
  <text x="768" y="386" fill="#94A3B8" font-size="10">TD3 / SAC 穩定技巧</text>

  <!-- Suggested path -->
  <rect x="48" y="440" width="868" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="72" y="470" fill="#F8FAFC" font-size="13" font-weight="600">建議學習路徑</text>
  <text x="72" y="494" fill="#94A3B8" font-size="12">1. 裝 gymnasium / numpy（可選 torch）　2. 讀 W1，把 W2–3 演示跑到策略穩定　3. 自行在 CliffWalking-v0 實作 Q-learning　4. 續學策略梯度 / Actor-Critic　5. 用 W14 實驗清單做專題</text>
  <text x="72" y="514" fill="#64748B" font-size="11">純 HTML / CSS / JS · Canvas 視覺化 · 可離線 · 適合 GitHub Pages · 進度存 localStorage</text>
</svg>
